name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Force Java 21
        shell: bash
        run: |
          echo "=== Java before ==="
          java -version || true
          javac -version || true

          echo "=== Finding Java 21 ==="

          JAVA21_HOME=""

          if [ -n "$JAVA_HOME_21_X64" ] && [ -x "$JAVA_HOME_21_X64/bin/javac" ]; then
            JAVA21_HOME="$JAVA_HOME_21_X64"
          fi

          if [ -z "$JAVA21_HOME" ]; then
            JAVA21_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          fi

          export JAVA_HOME="$JAVA21_HOME"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          echo "=== Java after ==="
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

          if ! "$JAVA_HOME/bin/javac" -version 2>&1 | grep -q '21\.'; then
            echo "ERROR: Java 21 compiler was not found."
            exit 1
          fi

      - name: Install packages
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Clean old Android
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Configure Gradle Java
        shell: bash
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          echo "=== Final Java check ==="
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      - name: Verify Gradle
        shell: bash
        run: |
          cd android
          ./gradlew -version

      - name: Build APK
        shell: bash
        run: |
          cd android

          ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
