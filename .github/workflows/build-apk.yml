name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          which javac
          java -version
          javac -version

      - name: Install packages
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Clean old Android
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Check Gradle Java
        run: |
          cd android
          ./gradlew -version

      - name: Build APK
        run: |
          cd android
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
