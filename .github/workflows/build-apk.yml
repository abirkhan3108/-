name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Force Java 21
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Install packages
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Clean old Android
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Force Gradle Java 21
        shell: bash
        run: |
          mkdir -p android

          if [ -f android/gradle.properties ]; then
            sed -i '/^org.gradle.java.home=/d' android/gradle.properties
          fi

          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          echo "=== JAVA CHECK ==="
          java -version
          javac -version

          echo "=== GRADLE JAVA PROPERTY ==="
          grep "org.gradle.java.home" android/gradle.properties || true

      - name: Check Gradle Java
        shell: bash
        run: |
          cd android
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
